<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetroTrack Zulia | Monitoreo Petrolero</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Leaflet CSS (Mapa OpenStreetMap/Google Maps Alternative) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { min-height: 100vh; background-color: #1a252f; }
        .sidebar .nav-link { color: #adb5bd; font-weight: 500; margin-bottom: 5px; border-radius: 8px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #0d6efd; color: #fff; }
        #mapa-activos { height: 500px; width: 100%; border-radius: 12px; }
    </style>
</head>
<body>

    <div class="d-flex">
        <!-- Sidebar lateral de navegación -->
        <div class="sidebar p-3 d-flex flex-column flex-shrink-0 text-white" style="width: 260px;">
            <a href="#dashboard" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <i class="bi bi-fuel-pump-fill fs-3 text-warning me-2"></i>
                <span class="fs-5 fw-bold">PetroTrack Zulia</span>
            </a>
            <hr class="text-secondary">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item"><a href="#dashboard" class="nav-link"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a></li>
                <li><a href="#mapa" class="nav-link"><i class="bi bi-geo-alt-fill me-2"></i> Mapa de Activos</a></li>
                <li><a href="#activos" class="nav-link"><i class="bi bi-bounding-box-circles me-2"></i> Pozos / Tanques</a></li>
                <li><a href="#lecturas" class="nav-link"><i class="bi bi-activity me-2"></i> Lecturas PSI</a></li>
                <li><a href="#reportes" class="nav-link"><i class="bi bi-file-earmark-pdf me-2"></i> Reportes</a></li>
            </ul>
            <hr class="text-secondary">
            <div class="dropdown">
                <small class="text-muted d-block">Usuario en Sesión:</small>
                <strong class="text-light"><i class="bi bi-person-circle"></i> Ing. Juan Medina</strong>
            </div>
        </div>

        <!-- Contenedor Principal de la SPA -->
        <div class="flex-grow-1 p-4" id="app">
            <!-- El contenido dinámico cargado por app.js se renderiza aquí -->
        </div>
    </div>

    <!-- Bootstrap & Leaflet JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Enrutador SPA -->
    <script src="app.js"></script>
</body>
</html>
